type: urban
num_zones: 4
max_cameras_per_zone: 15
episode_length: 500

zones:
  - zone_type: commercial
    max_cameras: 15
    base_anomaly_rate: 0.12
  - zone_type: residential
    max_cameras: 15
    base_anomaly_rate: 0.06
  - zone_type: highway
    max_cameras: 15
    base_anomaly_rate: 0.10
  - zone_type: parking
    max_cameras: 15
    base_anomaly_rate: 0.04

weather:
  states: [clear, rain, fog]
  transition_matrix:
    - [0.90, 0.07, 0.03]
    - [0.15, 0.75, 0.10]
    - [0.20, 0.10, 0.70]
  initial_state: clear

failures:
  camera_dropout_prob: 0.02
  camera_dropout_duration: 20
  gpu_failure_prob: 0.01
  gpu_failure_duration: 50
  gpu_failure_capacity_loss: 0.3
  network_congestion_prob: 0.015
  network_congestion_duration: 30
  network_congestion_bandwidth_loss: 0.4

resources:
  total_gpu_budget: 100.0
  total_bandwidth_budget: 100.0

domain_randomization:
  enabled: false

spatial_correlation_decay: 5
spatial_correlation_boost: 0.3