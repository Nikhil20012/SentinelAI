[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Hierarchical multi-agent RL for adaptive compute allocation in distributed vision systems"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "pettingzoo>=1.24.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "ray[rllib]>=2.9.0",
    "torch>=2.1.0",
    "wandb>=0.16.0",
]
eval = [
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "shap>=0.44.0",
    "scikit-learn>=1.3.0",
]
serve = [
    "redis>=5.0.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "prometheus-client>=0.19.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
